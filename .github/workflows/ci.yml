name: CI

# Push only: a branch with an open pull request is tested by its pushes, so
# pull_request would run every job a second time.
on:
  push:

jobs:
  test:
    name: FA ${{ matrix.fa.name }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
        fa:
          - name: upstream
            repo: https://github.com/FrontAccountingERP/FA.git
            ref: master
          - name: fork
            repo: https://github.com/cambell-prince/frontaccounting.git
            ref: master-cp
    env:
      PHP_VERSION: ${{ matrix.php }}
      FA_REPO: ${{ matrix.fa.repo }}
      FA_REF: ${{ matrix.fa.ref }}
      COMPOSE_PROJECT_NAME: fa-graphql-ci-${{ matrix.fa.name }}-${{ matrix.php }}
      # sgw_sales' GraphQL extension (Release 4 spec §6). Its PR is open on this
      # branch; the image clones by branch or tag (a shallow clone cannot take a
      # commit SHA). Switch to master once sgw_sales' PR merges.
      SGW_SALES_REF: feature/graphql-extension
    steps:
      - uses: actions/checkout@v4
      - name: Build, boot, lint, analyze, test
        run: docker/fa-graphql ci
      - name: Logs
        if: failure()
        run: |
          docker/fa-graphql logs app || true
          docker/fa-graphql logs errors || true
