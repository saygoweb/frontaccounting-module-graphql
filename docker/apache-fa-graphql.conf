# Port 8000 rather than 80, matching the sibling modules/api stack. tests/Http
# reaches it as http://localhost:8000 because phpunit runs in this container.
# The host port from docker/.env is mapped onto this one.
<VirtualHost *:8000>
    ServerName localhost
    DocumentRoot /var/www/html

    # To the container log, so `fa-graphql logs app` shows something. Debian's
    # default sends both to files under /var/log/apache2, where nothing looks.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # mod_php drops the Authorization header unless asked not to, and a GraphQL
    # client is more likely to send a bearer token than FA's login form fields.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>

# The module's own .htaccess is what routes every request to index.php.
# Debian's default vhost sets AllowOverride None for /var/www, which would
# discard that silently. FrontAccounting's own root .htaccess, which denies
# direct fetches of .inc and .sql files, needs it back on for the same reason.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Nothing under these is fetched over HTTP, and they hold credentials, database
# dumps, and the git history of two repositories.
<DirectoryMatch "/var/www/html/(\.git|docker|node_modules|install/lang)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "/var/www/html/modules/graphql/(\.git|\.serena|docker|docs|sql|src|tests|tmp|vendor)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(config\.php|config_db\.php|installed_extensions\.php|composer\.(json|lock)|config_graphql.*)$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/var/www/html/company/[^/]+/(backup|attachments)">
    Require all denied
</DirectoryMatch>
