; PHP settings for the GraphQL module's test stack.
; Development values — do not copy these onto a live server.

; phpstan needs the headroom.
memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 32M
post_max_size = 32M

; FA's config.php sets a default when this is empty, but leaving it unset makes
; every date call emit a warning before that happens.
date.timezone = ${FA_TIMEZONE}

; display_errors is off here, unlike the FrontAccounting stack, because every
; response is JSON: a warning printed into the body makes json_decode() return
; null and the failure surfaces as an unintelligible assertion in some unrelated
; test. Errors go to the Apache log instead, which the vhost sends to the
; container log — `fa-graphql logs app`.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; Empty means the SAPI log: Apache's, which the vhost points at the container's
; stderr, and stderr directly for phpunit and composer.
error_log =

; Whether the extension is loaded at all is decided by the entrypoint, which
; runs phpdismod/phpenmod from XDEBUG_MODE — see docker-entrypoint.sh for why it
; has to be unloaded rather than merely idle. These sit in a zz- file so they are
; read after the package's own 20-xdebug.ini and win.
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
